name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: postgresql://tvc:tvc@localhost:5432/tvc

jobs:
  check:
    name: typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm test

  migrations:
    name: migrations and legacy import
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: tvc
          POSTGRES_PASSWORD: tvc
          POSTGRES_DB: tvc
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tvc -d tvc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run db:import -- --dry-run
        env:
          LEGACY_DATA_DIR: packages/db/test/fixtures/legacy

  build:
    name: web build
    runs-on: ubuntu-latest
    env:
      DISCORD_CLIENT_ID: ci
      DISCORD_CLIENT_SECRET: ci
      AUTH_SECRET: ci-secret-not-used-at-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run web:build
